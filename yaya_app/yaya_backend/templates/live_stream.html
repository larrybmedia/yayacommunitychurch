{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    {% if stream %}
        <h2 class="text-center mb-4 text-primary">{{ stream.title }}</h2>
        <div class="row justify-content-center">
            <div class="row">
              <div class="col-12 col-md-11 col-lg-10">
                  <div class="ratio ratio-21x9 shadow-lg rounded overflow-hidden">
                      <iframe 
                          src="{{ stream.url | youtube_embed }}" 
                          title="Live Stream" 
                          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                          allowfullscreen>
                      </iframe>
                  </div>
              </div>
          </div>
        </div>
    {% else %}
        <div class="text-center py-5">
            <h3>No Live Stream Currently Available</h3>
            <p class="text-muted">Please check back later.</p>
            <a href="/" class="btn btn-outline-primary">Back to Home</a>
        </div>
    {% endif %}
</div>
{% endblock %}
