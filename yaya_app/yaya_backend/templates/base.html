<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCCG YAYA | Portal</title>

    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/rccg_yaya.png') }}">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <style>
        :root {
            --primary-blue: #004a99;
            --accent-gold: #ffc107;
        }

        body {
            font-family: 'Inter', sans-serif;
            background:
                linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
                url('{{ url_for("static", filename="yaya.jpg") }}');
            background-size: cover;
            background-attachment: fixed;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-container {
            flex: 1;
            padding: 3rem 1rem;
            background: #f8f9fa;
            color: #333;
        }

        {% if request.endpoint == 'main.index' %}
        .main-container {
            background:
                linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                url('{{ url_for("static", filename="rccg_ycc.jpg") }}') !important;
            color: #fff !important;
        }
        {% endif %}

        .navbar {
            background: rgba(255,255,255,0.98);
            border-bottom: 4px solid var(--primary-blue);
        }

        .navbar-brand {
            font-weight: 800;
            color: var(--primary-blue) !important;
        }

        .footer {
            background: #002d5e;
            color: white;
            padding: 40px 0;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-xl navbar-light sticky-top">
    <div class="container-fluid px-4">

        <a class="navbar-brand" href="{{ url_for('main.index') }}">
            RCCG YAYA
        </a>

        <div class="collapse navbar-collapse">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('main.about') }}">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('main.give') }}">
                        Give
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('main.jobs') }}">
                        Jobs
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('main.events') }}">
                        Events
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('main.testimonies') }}">
                        Testimonies
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('main.manuals') }}">
                        Manuals
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-primary font-weight-bold"
                      href="{{ url_for('admin.server_verification') }}">
                        Admin Login
                    </a>
                </li>

            </ul>

            <!-- BRANCH SEARCH -->
            <form action="{{ url_for('main.select_branch_by_name') }}" method="POST" class="mr-3">
                <input list="parish-options" name="branch_name" class="form-control form-control-sm" placeholder="Find Parish">
                <datalist id="parish-options">
                    {% for branch in branches %}
                        <option value="{{ branch.name }}">
                    {% endfor %}
                </datalist>
                <button class="btn btn-primary btn-sm mt-1">Search</button>
            </form>

        </div>
    </div>
</nav>

<!-- CONTENT -->
<main class="container-fluid main-container">
    {% block content %}{% endblock %}
</main>

<!-- FOOTER -->
<footer class="footer text-center">
    RCCG YAYA COMMUNITY CHURCH © 2026
</footer>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
