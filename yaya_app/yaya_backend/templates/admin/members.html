{% extends 'admin/dashboard_base.html' %}

{% block dashboard_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-dark">Parishioner Directory</h3>
    
    <div class="d-flex">
        <form action="{{ url_for('admin.members') }}" method="GET" class="d-flex me-2">
            <input type="text" name="search" class="form-control me-2" placeholder="Search by name..." value="{{ request.args.get('search', '') }}">
            <button type="submit" class="btn btn-outline-primary"><i class="fas fa-search"></i></button>
        </form>
        
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addMemberModal">
            <i class="fas fa-user-plus"></i> Add Member
        </button>
    </div>
</div>

<div class="card shadow-sm border-0">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                </tr>
            </thead>
            <tbody>
                {% for member in members %}
                <tr>
                    <td>{{ member.full_name }}</td>
                    <td>{{ member.email }}</td>
                    <td>{{ member.phone }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">No members found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="addMemberModal" tabindex="-1">
    <div class="modal-dialog">
        <form action="{{ url_for('admin.add_member') }}" method="POST" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Member</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="text" name="full_name" class="form-control mb-2" placeholder="Full Name" required>
                <input type="email" name="email" class="form-control mb-2" placeholder="Email">
                <input type="text" name="phone" class="form-control" placeholder="Phone Number">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-success">Save Member</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
