<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <title>Admin Dashboard | RCCG YAYA</title>
</head>
<body class="bg-light">

<div class="d-flex">
    <!-- SIDEBAR -->
    <nav id="sidebar" class="bg-dark text-white p-3">
        <h5 class="text-center py-3">Management</h5>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('admin.index') }}"><i class="fas fa-home me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('admin.stream_settings') }}"><i class="fas fa-video me-2"></i>Stream Gateway</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="#"><i class="fas fa-users me-2"></i>Members</a></li>
            <li class="nav-item"><hr class="my-2"></li>
            <li class="nav-item"><a class="nav-link text-danger" href="{{ url_for('main.logout') }}"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
        </ul>
    </nav>

    <!-- CONTENT AREA -->
    <main class="flex-grow-1 p-4">
        {% block dashboard_content %}{% endblock %}
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
