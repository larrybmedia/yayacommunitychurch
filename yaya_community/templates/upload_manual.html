{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="text-center mb-4">
            <h1 class="page-header">Upload Resource</h1>
            <p class="text-muted">Add a new PDF manual to the Resource Library.</p>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form method="POST" enctype="multipart/form-data">
                    <div class="form-group">
                        <label class="font-weight-bold">Manual Title</label>
                        <input type="text" name="title" class="form-control" placeholder="e.g., 2026 Workers Guide" required>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold">Category</label>
                        <select name="category" class="form-control">
                            <option value="Leadership">Leadership</option>
                            <option value="Study">Study Outline</option>
                            <option value="Protocol">Protocol & Ethics</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold">Brief Description</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="What is this document about?"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold">Select PDF File</label>
                        <div class="custom-file">
                            <input type="file" name="manual_file" class="custom-file-input" id="customFile" accept=".pdf" required>
                            <label class="custom-file-label" for="customFile">Choose file</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block shadow-sm">
                        <i class="fas fa-cloud-upload-alt mr-2"></i> Upload to Library
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Script to show filename on selection
    $(".custom-file-input").on("change", function() {
      var fileName = $(this).val().split("\\").pop();
      $(this).siblings(".custom-file-label").addClass("selected").html(fileName);
    });
</script>
{% endblock %}
